<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ActiveDeliver Next</title>
  <meta name="theme-color" content="#1e293b" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_JOBS = [
      { id: '30231453-2', client: 'Harris Tripp', address: '356 New Canterbury Road, Dulwich Hill', boxes: 1, type: 'Envelope', isDispatched: true, status: 'picked_up' },
      { id: '30208566-2', client: 'McGrath Real Estate', address: '124 Crown Street, Surry Hills', boxes: 3, type: 'Box', isDispatched: false, status: 'pending' },
      { id: '30232628-1', client: 'RH Morton Pyrmont', address: 'Suite 2, 12 Wharf Crescent, Pyrmont', boxes: 1, type: 'Envelope', isDispatched: true, status: 'picked_up' },
      { id: '30234112-1', client: 'Stone Real Estate Commercial', address: '480 Pacific Highway, Crows Nest', boxes: 2, type: 'Box', isDispatched: false, status: 'pending' },
      { id: '30235590-3', client: 'Belle Property Mosman', address: '102 Military Road, Neutral Bay', boxes: 1, type: 'Box', isDispatched: false, status: 'pending' }
    ];

    function App() {
      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('ad_next_jobs');
        return saved ? JSON.parse(saved) : INITIAL_JOBS;
      });
      const [pickupDialog, setPickupDialog] = useState(null);
      const [deliveryDialog, setDeliveryDialog] = useState(null);
      const [searchCode, setSearchCode] = useState('');
      const [photoPreview, setPhotoPreview] = useState(null);
      const [dropPreset, setDropPreset] = useState('Front Door (หน้าประตู)');
      const [dropNote, setDropNote] = useState('');

      useEffect(() => {
        localStorage.setItem('ad_next_jobs', JSON.stringify(jobs));
      }, [jobs]);

      const handleScan = (code) => {
        const clean = code.trim();
        const job = jobs.find(j => j.id.toLowerCase() === clean.toLowerCase() || clean.includes(j.id));
        if (!job) {
          alert('ไม่พบบาร์โค้ด: ' + clean);
          return;
        }
        if (!job.isDispatched) {
          setPickupDialog(job);
        } else {
          setDeliveryDialog(job);
        }
        setSearchCode('');
      };

      const confirmPickup = (id) => {
        setJobs(jobs.map(j => j.id === id ? { ...j, isDispatched: true, status: 'picked_up' } : j));
        setPickupDialog(null);
      };

      const confirmDelivery = (id) => {
        setJobs(jobs.map(j => j.id === id ? { ...j, status: 'delivered', photo: photoPreview, dropPreset, dropNote, deliveredAt: new Date().toLocaleTimeString() } : j));
        setDeliveryDialog(null);
        setPhotoPreview(null);
        setDropNote('');
      };

      const pending = jobs.filter(j => !j.isDispatched).length;
      const picked = jobs.filter(j => j.isDispatched && j.status !== 'delivered').length;
      const delivered = jobs.filter(j => j.status === 'delivered').length;

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto bg-slate-900 shadow-2xl relative overflow-hidden">
          <header className="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center">
            <div className="flex items-center space-x-2">
              <span className="bg-blue-600 text-white p-2 rounded-lg text-lg"><i className="fa-solid fa-truck-fast"></i></span>
              <div>
                <h1 className="font-bold text-white text-base leading-tight">ActiveDeliver Next</h1>
                <p className="text-xs text-slate-400">Sydney Courier • {jobs.length} งาน</p>
              </div>
            </div>
            <span className="bg-emerald-950 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-medium flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> สแกนไว 0.1s
            </span>
          </header>

          <div className="grid grid-cols-3 gap-2 px-4 py-2 bg-slate-800/50 border-b border-slate-800 text-center text-xs">
            <div className="bg-orange-500/10 border border-orange-500/30 rounded-lg p-2 text-orange-400">
              <div className="text-base font-bold">{pending}</div>
              <div>รอรับของ</div>
            </div>
            <div className="bg-blue-500/10 border border-blue-500/30 rounded-lg p-2 text-blue-400">
              <div className="text-base font-bold">{picked}</div>
              <div>อยู่บนรถ</div>
            </div>
            <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-lg p-2 text-emerald-400">
              <div className="text-base font-bold">{delivered}</div>
              <div>ส่งสำเร็จ</div>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
            {jobs.map((job) => (
              <div 
                key={job.id} 
                onClick={() => !job.isDispatched ? setPickupDialog(job) : job.status !== 'delivered' ? setDeliveryDialog(job) : null}
                className={"p-3.5 rounded-xl border transition-all cursor-pointer relative " + (
                  job.status === 'delivered' 
                    ? 'bg-slate-800/40 border-slate-700/50 opacity-60' 
                    : !job.isDispatched 
                      ? 'bg-orange-950/20 border-orange-500/40 hover:border-orange-500' 
                      : 'bg-slate-800 border-slate-700 hover:border-blue-500'
                )}
              >
                <div className="flex justify-between items-start mb-1.5">
                  <span className="font-bold text-sm text-white">{job.client}</span>
                  <span className={"text-[10px] uppercase font-bold px-2 py-0.5 rounded-full " + (
                    job.status === 'delivered' ? 'bg-emerald-500/20 text-emerald-400' :
                    !job.isDispatched ? 'bg-orange-500/20 text-orange-400' : 'bg-blue-500/20 text-blue-400'
                  )}>
                    {job.status === 'delivered' ? 'ส่งแล้ว' : !job.isDispatched ? 'รอรับของ' : 'รับแล้ว'}
                  </span>
                </div>
                <div className="text-xs text-slate-300 mb-2 flex items-start gap-1.5">
                  <i className="fa-solid fa-location-dot text-slate-400 mt-0.5"></i>
                  <span>{job.address}</span>
                </div>
                <div className="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-700/60">
                  <span className="font-mono font-medium text-slate-300">{job.id}</span>
                  <span className="font-semibold text-slate-200">{job.boxes} {job.type}</span>
                </div>
              </div>
            ))}
          </div>

          <div className="absolute bottom-4 left-4 right-4 z-20">
            <div className="bg-slate-800 p-2 rounded-2xl border border-slate-700 shadow-2xl flex gap-2">
              <input 
                type="text"
                value={searchCode}
                onChange={(e) => setSearchCode(e.target.value)}
                placeholder="สแกนหรือพิมพ์เลขงาน..."
                className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white font-mono focus:outline-none focus:border-blue-500"
              />
              <button 
                onClick={() => handleScan(searchCode)}
                className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow-lg"
              >
                <i className="fa-solid fa-barcode mr-1"></i> สแกน
              </button>
            </div>
          </div>

          {pickupDialog && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 space-y-4 text-center">
                <div className="w-12 h-12 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center mx-auto text-xl">
                  <i className="fa-solid fa-box-open"></i>
                </div>
                <div>
                  <h3 className="font-bold text-white text-lg">Confirm Pickup Job</h3>
                  <p className="text-xs text-slate-400 mt-1">This job comprises of: <strong className="text-orange-400">{pickupDialog.boxes} {pickupDialog.type}</strong></p>
                  <p className="text-xs font-mono text-slate-500 mt-1">{pickupDialog.id}</p>
                </div>
                <div className="bg-slate-900 p-3 rounded-lg text-left text-xs space-y-1 text-slate-300">
                  <div><strong>ลูกค้า:</strong> {pickupDialog.client}</div>
                  <div><strong>ที่อยู่:</strong> {pickupDialog.address}</div>
                </div>
                <div className="flex gap-3">
                  <button onClick={() => setPickupDialog(null)} className="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold">
                    Cancel
                  </button>
                  <button onClick={() => confirmPickup(pickupDialog.id)} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg">
                    Confirm
                  </button>
                </div>
              </div>
            </div>
          )}

          {deliveryDialog && (
            <div className="fixed inset-0 bg-slate-900 z-50 flex flex-col p-4 overflow-y-auto">
              <div className="flex justify-between items-center mb-4">
                <h2 className="font-bold text-white text-base"><i className="fa-solid fa-circle-check text-blue-500 mr-1.5"></i> บันทึกการส่งของ (Delivery)</h2>
                <button onClick={() => setDeliveryDialog(null)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
              </div>
              <div className="bg-slate-800 p-4 rounded-xl space-y-2 mb-4 border border-slate-700 text-xs">
                <div className="font-bold text-sm text-white">{deliveryDialog.client}</div>
                <div className="text-slate-300"><i className="fa-solid fa-location-dot mr-1"></i> {deliveryDialog.address}</div>
                <div className="text-slate-400 font-mono">เลขที่งาน: {deliveryDialog.id} ({deliveryDialog.boxes} {deliveryDialog.type})</div>
              </div>
              <div className="space-y-2 mb-4">
                <label className="text-xs font-bold text-white flex justify-between">
                  <span>ถ่ายรูปจุดวางของ (Proof of Delivery Photo)</span>
                  <span className="text-emerald-400 text-[10px]"><i className="fa-solid fa-shield mr-1"></i> ฝังพิกัด GPS อัตโนมัติ</span>
                </label>
                <div className="h-44 bg-slate-800 border-2 border-dashed border-slate-600 rounded-xl relative flex flex-col items-center justify-center overflow-hidden">
                  {photoPreview ? (
                    <div className="relative w-full h-full">
                      <img src={photoPreview} alt="Drop-off preview" className="w-full h-full object-cover" />
                      <div className="absolute bottom-0 inset-x-0 bg-black/75 p-2 text-[10px] text-white font-mono leading-tight">
                        <div>📍 GPS: -33.8688, 151.1932 (Sydney NSW)</div>
                        <div>🕒 เวลา: {new Date().toLocaleString()}</div>
                        <div>🏢 {deliveryDialog.address}</div>
                      </div>
                    </div>
                  ) : (
                    <button 
                      onClick={() => setPhotoPreview('https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=500&auto=format&fit=crop&q=60')}
                      className="text-center space-y-2 text-slate-400 hover:text-white"
                    >
                      <i className="fa-solid fa-camera text-3xl text-blue-400"></i>
                      <div className="text-xs font-medium">กดเพื่อถ่ายรูปจุดที่วางของ</div>
                    </button>
                  )}
                </div>
              </div>
              <div className="space-y-2 mb-4">
                <label className="text-xs font-bold text-white">ระบุจุดที่วางพัสดุ:</label>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  {['Front Door (หน้าประตู)', 'Reception (เคาน์เตอร์)', 'Safe Place (จุดปลอดภัย)', 'Mailbox (ตู้จดหมาย)'].map((p) => (
                    <button 
                      key={p} 
                      onClick={() => setDropPreset(p)}
                      className={"py-2 px-3 rounded-lg border text-left font-medium " + (dropPreset === p ? 'bg-blue-600/30 border-blue-500 text-blue-300' : 'bg-slate-800 border-slate-700 text-slate-400')}
                    >
                      {p}
                    </button>
                  ))}
                </div>
              </div>
              <div className="space-y-2 mb-6">
                <label className="text-xs font-bold text-white">บันทึกโน้ตเพิ่มเติม:</label>
                <input 
                  type="text" 
                  value={dropNote}
                  onChange={(e) => setDropNote(e.target.value)}
                  placeholder="เช่น วางไว้หลังเสาข้างประตู..."
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"
                />
              </div>
              <button 
                onClick={() => confirmDelivery(deliveryDialog.id)}
                className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm shadow-xl flex items-center justify-center gap-2 mt-auto"
              >
                <i className="fa-solid fa-paper-plane"></i> บันทึกและยืนยันส่งพัสดุ
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
